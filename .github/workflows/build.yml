# Builds the mod and runs the in-game tests on every push and pull request.
# On main, once both pass, the jar is published as a GitHub release named after the
# `version` in gradle.properties (only the first time each version appears).
name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: locator-compass
          path: build/libs/

  # Runs src/gametest in a real headless client: block search, needle angles and bag clicks.
  client-game-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install headless graphics
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: run client game test
        # Our own 24-bit Xvfb (xvfb-run's default 8-bit screen has no GLX visual); `env -u CI` stops Loom wrapping it again.
        run: |
          chmod +x ./gradlew
          env -u CI timeout 20m xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew runClientGameTest --stacktrace
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-screenshots
          path: build/run/clientGameTest/screenshots

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, client-game-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: locator-compass
          path: libs
      - name: publish release if this version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released"
          else
            gh release create "v$VERSION" "libs/locator-compass-$VERSION.jar" \
              --target "$GITHUB_SHA" \
              --title "Locator Compass $VERSION" \
              --notes "Fabric mod for Minecraft 26.3. Requires Fabric Loader 0.20.1+ and Fabric API 0.165.0+26.3. Drop the jar into your instance's mods folder."
          fi
