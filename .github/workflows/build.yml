# Builds the mod on every push and pull request.
# Pushing a tag like `v1.0.0` also publishes the jar as a GitHub release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: locator-compass
          path: build/libs/
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/locator-compass-*.jar \
            --title "Locator Compass $GITHUB_REF_NAME" \
            --notes "Fabric mod for Minecraft 26.3. Requires Fabric Loader 0.20.1+ and Fabric API."

  # Runs src/gametest in a real headless client: block search, needle angles and bag clicks.
  client-game-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install headless graphics
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: run client game test
        # Our own 24-bit Xvfb (xvfb-run's default 8-bit screen has no GLX visual); `env -u CI` stops Loom wrapping it again.
        run: |
          chmod +x ./gradlew
          env -u CI timeout 20m xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew runClientGameTest --stacktrace
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-screenshots
          path: build/run/clientGameTest/screenshots
